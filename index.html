<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巫溪智慧农业管理平台</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00a854 0%, #007c3f 100%);
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 360px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #00a854;
      margin: 0 0 8px 0;
    }
    .login-header p {
      font-size: 14px;
      color: #888;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00a854;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #00a854;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: #00994d;
    }
    .login-btn:active {
      background: #008c42;
    }
    .error-msg {
      color: #ff4d4f;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>巫溪智慧农业管理平台</h1>
      <p>请输入账号密码登录</p>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button type="submit" class="login-btn">登录</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      // 不限制登录，直接跳转到主页
      window.location.href = 'pages/device-monitor/index.html';
    }
  </script>
</body>
</html>
